<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Online | SEU Career Connect</title>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        :root {
            --bg-deep: #000000;
            --bg-card: rgba(18, 26, 41, 0.75);
            --neon-blue: #0066ff;
            --neon-glow: rgba(0, 102, 255, 0.3);
            --neon-green: #00ff66;
            --border-glass: rgba(255, 255, 255, 0.1);
            --text-main: #ffffff;
            --text-muted: #94a3b8;
        }

        body {
            background-color: var(--bg-deep);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            margin: 0;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-glass);
            z-index: 1000;
            padding: 15px 0;
        }

        .container {
            max-width: 750px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .flex-nav {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .varsity-logo {
            width: 42px;
            height: 42px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid var(--neon-blue);
        }

        .logo-text h2 {
            font-size: 1.1rem;
            font-weight: 800;
            color: #fff;
            margin: 0;
        }

        .logo-text h2 span {
            color: var(--neon-blue);
        }

        .logo-text small {
            font-size: 0.7rem;
            color: var(--text-muted);
            text-transform: uppercase;
        }

        .nav-links {
            display: flex;
            gap: 25px;
            list-style: none;
            margin: 0;
            padding: 0;
            align-items: center;
        }

        .nav-links a {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: 0.3s;
        }

        .nav-links a:hover, .nav-links a.active {
            color: #fff;
            text-shadow: 0 0 10px var(--neon-blue);
        }

        .main-content {
            padding: 130px 0 60px 0;
        }

        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-glass);
            backdrop-filter: blur(16px);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.8);
        }

        .card h1 {
            font-size: 1.8rem;
            margin-bottom: 5px;
            text-align: center;
        }

        .target-role {
            color: var(--neon-blue);
            text-align: center;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 25px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            background: rgba(0,0,0,0.5);
            border: 1px solid var(--border-glass);
            padding: 12px 15px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            box-sizing: border-box;
        }

        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--neon-blue);
            box-shadow: 0 0 10px var(--neon-glow);
        }

        .btn-submit {
            width: 100%;
            background: var(--neon-blue);
            border: none;
            color: #fff;
            padding: 12px;
            border-radius: 8px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-submit:hover {
            background: #0052cc;
            box-shadow: 0 0 15px var(--neon-blue);
        }

        .success-alert {
            display: none;
            background: rgba(0, 255, 102, 0.15);
            border: 2px solid var(--neon-green);
            color: #00ff66;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div style="width: 100%;">
            <div class="flex-nav">
                <a href="index.html" class="logo-container">
                    <img src="images/download.jpg" alt="SEU Logo" class="varsity-logo">
                    <div class="logo-text">
                        <h2>SOUTHEAST <span>UNIVERSITY</span></h2>
                        <small>Career Connect Portal</small>
                    </div>
                </a>
                <nav>
                    <ul class="nav-links">
                        <li><a href="index.html">Home</a></li>
                        <li><a href="jobs.html">Find Jobs</a></li>
                        <li><a href="internships.html">Internships</a></li>
                        <li><a href="dashboard.html">Dashboard</a></li>
                    </ul>
                </nav>
            </div>
        </div>
    </header>

    <div class="container main-content">
        <div class="card">
            <h1>Submit Your Application</h1>
            <div id="roleDisplay" class="target-role">Position: General Application</div>
            
            <div id="successAlert" class="success-alert">
                <i class="fa-solid fa-circle-check" style="font-size: 2.5rem; margin-bottom: 12px; display: block;"></i>
                <h3 style="margin: 0 0 8px 0; font-size: 1.4rem;">APPLICATION SUBMITTED!</h3>
                <p style="margin: 0 0 20px 0; color: #a3ffc2;">Your resume has been successfully forwarded to the recruiter.</p>
                <a href="jobs.html" style="background:#00ff66; color:#000; padding:10px 20px; border-radius:6px; font-weight:700; text-decoration:none; display:inline-block;">Browse More Jobs</a>
            </div>

            <form id="applyForm">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" placeholder="e.g. Md. Tanvir Ahmed" required>
                </div>
                <div class="form-group">
                    <label>SEU Student ID</label>
                    <input type="text" placeholder="e.g. 202300123" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" placeholder="student@seu.edu.bd" required>
                </div>
                <div class="form-group">
                    <label>LinkedIn / GitHub Profile URL</label>
                    <input type="url" placeholder="https://linkedin.com/in/username" required>
                </div>
                <div class="form-group">
                    <label>Upload Resume / CV Link (Google Drive / PDF Link)</label>
                    <input type="url" placeholder="Paste your CV link here" required>
                </div>
                <button type="submit" class="btn-submit">Submit Application</button>
            </form>
        </div>
    </div>

    <script>
        // Catch title from URL parameters
        const urlParams = new URLSearchParams(window.location.search);
        const position = urlParams.get('position');
        if(position) {
            document.getElementById('roleDisplay').innerText = "Applying For: " + decodeURIComponent(position);
        }

        document.getElementById('applyForm').addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('applyForm').style.display = 'none';
            document.getElementById('roleDisplay').style.display = 'none';
            document.getElementById('successAlert').style.display = 'block';
        });
    </script>
    <script src="js/script.js"></script>
</body>
</html>
